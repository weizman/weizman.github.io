<!DOCTYPE html>
<html>
<body>

    <h2>Clipboard Copy Example</h2>

    <input type="text" value="xxx" id="myInput">

    <button onclick="copyText()">Copy Text</button>

    <script>
        function copyText() {
            // 1. Get the text field
            var copyText = "xxx1";

            // 3. Use the modern Navigator Clipboard API to copy
            navigator.clipboard.writeText(copyText).then(() => {
                // Optional: Success feedback
                alert("Copied the text: " + copyText);
            }).catch(err => {
                console.error("Failed to copy: ", err);
            });
        }
        setTimeout(copyText,2000);
    </script>

</body>
</html>
